<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Placement Prediction Portal</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f9;margin:0}
.container{max-width:900px;margin:30px auto;background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
h1,h2{text-align:center}
.hidden{display:none}
.question{background:#f8f8f8;padding:12px;border-radius:8px;margin:10px 0}
button{background:#2563eb;color:#fff;border:none;padding:12px 18px;border-radius:8px;cursor:pointer}
button:hover{opacity:.9}
input{width:100%;padding:10px;margin-top:5px;margin-bottom:12px}
.result{font-size:22px;text-align:center;font-weight:bold}
</style>
</head>
<body>

<div class="container" id="welcome">
<h1>Student Placement Prediction</h1>
<p style="text-align:center">First complete the IQ Assessment Test.</p>
<div style="text-align:center">
<button onclick="startTest()">Start IQ Test</button>
</div>
</div>

<div class="container hidden" id="testPage">
<h2>IQ Assessment Test</h2>

<div id="questions"></div>

<div style="text-align:center;margin-top:20px">
<button onclick="calculateIQ()">Submit IQ Test</button>
</div>
</div>

<div class="container hidden" id="detailsPage">
<h2>Student Details</h2>

<input type="hidden" id="iq">

<label>CGPA</label>
<input type="number" step="0.01" id="cgpa">

<label>Previous Semester Result</label>
<input type="number" step="0.01" id="prev">

<label>Communication Skills (1-10)</label>
<input type="number" step="1" id="comm">

<label>Projects Completed</label>
<input type="number" step="1" id="projects">

<button onclick="predictPlacement()">Predict Placement</button>
</div>

<div class="container hidden" id="resultPage">
<h2>Prediction Result</h2>
<div id="finalResult" class="result"></div>
</div>

<script>
const questions=[
["2,4,8,16, ?",["32","24","30"],0],
["15% of 200 = ?",["30","25","20"],0],
["Odd one out?",["2","4","7"],2],
["10 × 10 = ?",["100","90","110"],0],
["50 + 25 = ?",["75","70","80"],0],
["Next: 1,4,9,16, ?",["25","20","36"],0],
["60 km/hr for 3 hrs = ?",["180","120","150"],0],
["Shape with 3 sides?",["Triangle","Square","Circle"],0],
["5 workers finish work in 10 days. 1 worker?",["50","20","40"],0],
["20% of 500 = ?",["100","80","120"],0]
];

const qDiv=document.getElementById("questions");

questions.forEach((q,i)=>{
let html=`<div class='question'><p>${i+1}. ${q[0]}</p>`;
q[1].forEach((op,j)=>{
html+=`<label><input type="radio" name="q${i}" value="${j}"> ${op}</label><br>`;
});
html+="</div>";
qDiv.innerHTML+=html;
});

function startTest(){
document.getElementById("welcome").classList.add("hidden");
document.getElementById("testPage").classList.remove("hidden");
}

function calculateIQ(){
let score=0;

questions.forEach((q,i)=>{
let ans=document.querySelector(`input[name='q${i}']:checked`);
if(ans && parseInt(ans.value)===q[2]) score++;
});

let iq=70+(score*5);

document.getElementById("iq").value=iq;

alert("IQ Score Generated: "+iq);

document.getElementById("testPage").classList.add("hidden");
document.getElementById("detailsPage").classList.remove("hidden");
}

function predictPlacement(){

let iq=parseFloat(document.getElementById("iq").value);
let cgpa=parseFloat(document.getElementById("cgpa").value||0);
let prev=parseFloat(document.getElementById("prev").value||0);
let comm=parseFloat(document.getElementById("comm").value||0);
let projects=parseFloat(document.getElementById("projects").value||0);

document.getElementById("detailsPage").classList.add("hidden");
document.getElementById("resultPage").classList.remove("hidden");

document.getElementById("finalResult").innerHTML=
`IQ Score: ${iq}<br><br>
CGPA: ${cgpa}<br><br>
(Temporary Frontend Demo)<br><br>
Connect FastAPI here for actual prediction.`;


fetch("http://127.0.0.1:8000/predict",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
IQ:iq,
CGPA:cgpa,
Prev_Sem_Result:prev,
Communication_Skills:comm,
Projects_Completed:projects
})
})
.then(res=>res.json())
.then(data=>{
document.getElementById("finalResult").innerHTML=data.prediction;
});

}
</script>
</body>
</html>
